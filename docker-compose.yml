services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: research_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: research_db
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research123
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
